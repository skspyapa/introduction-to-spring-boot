spring.application.name=introduction-to-spring-boot
server.port=8080
# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/pos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=sky
spring.datasource.password=sky123

# JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
#Hibernate looks at your entity classes (@Entity) and generates SQL to create/update/drop tables.
#none ? do nothing.
#validate ? just check schema vs entities, fail if mismatch.
#update ? create missing tables/columns, but don?t drop anything.
#create ? drop all tables and recreate them on startup.
#create-drop ? same as create, but also drop schema when app stops.
spring.jpa.hibernate.ddl-auto=none

# Always run schema.sql and data.sql
spring.sql.init.enabled=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect




